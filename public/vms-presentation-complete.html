/* CINEMATIC 3D + RESPONSIVE UPGRADE */
:root{--depth:#07131d;--edge:#65e8ff55;--glass:#ffffff09}
.scene3d{position:relative;min-height:255px;margin-top:25px;perspective:1200px;display:grid;place-items:center;overflow:visible}
.orbit{position:absolute;width:310px;height:160px;border:1px solid #65e8ff38;border-radius:50%;transform:rotateX(65deg);box-shadow:0 0 35px #65e8ff12;animation:orbit 8s linear infinite}
.orbit.o2{width:240px;height:120px;border-color:#9a7cff45;transform:rotateX(65deg) rotateZ(55deg);animation-duration:11s}
@keyframes orbit{to{transform:rotateX(65deg) rotateZ(360deg)}}
.core3d{width:120px;height:120px;border-radius:28px;display:grid;place-items:center;text-align:center;font-weight:950;letter-spacing:.08em;background:linear-gradient(145deg,#65e8ff,#8977ff 65%,#151b45);color:#061018;box-shadow:inset -15px -18px 30px #0005, inset 8px 8px 20px #fff7,0 35px 70px #0009,0 0 50px #65e8ff2e;transform:rotateX(15deg) rotateY(-18deg);animation:coreFloat 4s ease-in-out infinite}
@keyframes coreFloat{50%{transform:rotateX(18deg) rotateY(-12deg) translateY(-10px)}}
.floatCard{position:absolute;padding:11px 14px;border:1px solid #ffffff1c;background:#0b1824dd;backdrop-filter:blur(12px);border-radius:12px;font-size:8px;box-shadow:0 18px 35px #0008;animation:cardFloat 4s ease-in-out infinite}
.fc1{left:7%;top:18%}.fc2{right:7%;top:12%;animation-delay:-1s}.fc3{left:13%;bottom:10%;animation-delay:-2s}.fc4{right:12%;bottom:8%;animation-delay:-3s}
@keyframes cardFloat{50%{transform:translateY(-9px) rotateX(5deg)}}
.holo{height:250px;border:1px solid #65e8ff2e;border-radius:22px;background:linear-gradient(145deg,#102332cc,#071019ee);position:relative;overflow:hidden;box-shadow:0 35px 80px #0009,inset 0 0 50px #65e8ff08}
.holo:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 49%,#65e8ff0b 50%,transparent 51%);background-size:100% 12px;animation:holoScan 3s linear infinite}
@keyframes holoScan{to{background-position:0 120px}}
.radar{width:190px;height:190px;border-radius:50%;border:1px solid #65e8ff55;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#65e8ff16 0 2px,transparent 3px 32px,#65e8ff13 33px 34px,transparent 35px 64px,#65e8ff13 65px 66px,transparent 67px)}
.radar:after{content:"";position:absolute;width:50%;height:2px;left:50%;top:50%;transform-origin:left;background:linear-gradient(90deg,var(--cyan),transparent);animation:radar 2.5s linear infinite}
@keyframes radar{to{transform:rotate(360deg)}}
.beacon{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 20px var(--cyan);animation:beacon 1.6s infinite}
@keyframes beacon{50%{opacity:.25;transform:scale(2)}}
.stack3d{position:relative;height:250px;display:grid;place-items:center;perspective:1000px}
.layer{position:absolute;width:250px;height:145px;border:1px solid #ffffff20;border-radius:18px;background:linear-gradient(145deg,#132737,#09121a);box-shadow:0 25px 55px #0008;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.08em;font-size:11px}

.layer:nth-child(3){transform:translateZ(-30px) rotateX(58deg) rotateZ(-8deg);opacity:.5}

<script>
(()=>{"use strict";
const deck=document.getElementById("deck"),count=document.getElementById("count"),progress=document.getElementById("progress");
const slides=[
["01 · VMS-SAIDHARA","Visitor Management System<br><span>for NDC Godrej at Saidhara</span>","A connected command center for visitors, security desks, assets, gate passes, transfers, appointments and operational history.",["VISITOR CONTROL|Know who is inside|Identity, host, purpose, location and timestamps.","ASSET CONTROL|Know what is moving|Assets, passes, transfers and returns.","COMMAND CENTER|See the operation|A single system for front desk and security workflows."]],
["02 · COMMAND CENTER","The system at a glance","A live-style operations view brings the most important signals together before staff enter individual modules.",["LIVE OPERATIONS|One view|Visitors, assets, gate passes and transfers.","LOCATION NETWORK|Connected desks|Admin plus controlled warehouse locations.","ACTION CONTEXT|Role aware|Admin sees all; security operates its location."]],
["03 · LOCATION ARCHITECTURE","One organization.<br><span>Many controlled locations.</span>","Location-aware access keeps each security desk focused while administration retains system-wide oversight.",["ADMIN|SYSTEM-WIDE|All locations and records.","I · J · K · L|WAREHOUSES|Location-scoped security operation.","O · P · Q · R · S · T|WAREHOUSES|Independent operational desks.","H14-MHE|MATERIAL HANDLING|Dedicated controlled location."]],
["04 · SECURITY DUTY","The login is the desk.<br><span>The duty session is the officer.</span>","Officers can rotate across shifts without creating individual Firebase accounts for every person.",["ROSTER|ADMIN SETUP|Create active/inactive security-person records.","START DUTY|SHIFT CONTEXT|Select the officer taking duty.","OPERATE|AUDIT CONTEXT|Actions retain officer identity.","END DUTY|CLOSE SHIFT|Explicitly end the active desk session."]],
["05 · VISITOR REGISTER","Every arrival becomes a structured record","The register captures identity and purpose while maintaining location and entry/exit context.",["IDENTITY|VISITOR|Name, company, mobile and optional photo.","HOST|MEETING|Whom to meet and why.","PURPOSE|VISIT TYPE|Meeting, Visitor, Official or Others.","LIFECYCLE|ENTRY → EXIT|Check-in and check-out timestamps."]],
["06 · VISITOR SERIAL","A visit gets a traceable identity","Daily atomic numbering makes front-desk records easy to reference without duplicate serials.",["FORMAT|V-YYYYMMDD-001|Readable daily visitor identity.","ATOMIC|FIRESTORE TRANSACTION|Counter allocation avoids collisions.","RESET|DAILY|A new day starts a new sequence.","SEARCH|OPERATIONS|Use serials to find a visit quickly."]],

["09 · ASSET CONTROL","Know what is moving,<br><span>who owns the movement.</span>","Asset records connect physical identity with responsibility, location and return status.",["IDENTITY|ASSET NUMBER|Unique operational reference.","DETAILS|MATERIAL|Description, type and returnability.","RESPONSIBILITY|ISSUED TO / BY|People attached to the issue.","STATUS|RETURN|Returned state with actor and timestamp."]],

["12 · INTERNAL TRANSFERS","Move material between locations<br><span>with accountability.</span>","Internal transfer records turn informal handovers into an auditable workflow.",["ITEM|WHAT|Item, description, asset/serial and quantity.","PEOPLE|WHO|Issued by and sending-via person.","ROUTE|WHERE|Source and destination locations.","RECEIVE|CLOSE|Destination security receives and closes."]],
["13 · TRANSFER DOCUMENT","A transfer has a physical identity","Transfer number, barcode and handover information make material movement easy to reference.",["ITP|IDENTITY|ITP-YYYY-XXXXXX.","SOURCE|SENT FROM|Controlled origin.","DESTINATION|SENT TO|Expected receiving desk.","STATUS|SENT → RECEIVED|Explicit lifecycle closure."]],
["14 · ANALYTICS CENTER","Operational records become<br><span>management intelligence.</span>","Analytics stays connected to the same operational data rather than becoming a separate reporting island.",["VISITORS|VOLUME|Activity and active visits.","ASSETS|STATUS|Registered, moving and returned.","GATE PASSES|CONTROL|Issued and returned.","TRANSFERS|MOVEMENT|Sent and received."]],
["15 · ASSET TIMELINE","One asset.<br><span>One complete story.</span>","A chronological movement rail connects every important state change.",["REGISTERED|05 OCT · 08:14|Warehouse I.","GATE PASS|08:26|Movement authorized.","TRANSFER SENT|09:02|I → Q.","TRANSFER RECEIVED|11:17|Warehouse Q.","RETURNED|CLOSED|Actor and timestamp."]],
["16 · MOVEMENT NETWORK","See the route, not just the record","Location movement can be understood as a connected operational network.",["ORIGIN|WAREHOUSE I|Source desk.","ROUTE|I → Q|Transfer movement.","DESTINATION|WAREHOUSE Q|Receiving desk.","HISTORY|EVENTS|Every major state change remains traceable."]],
["17 · PUBLIC APPOINTMENTS","The visit can start<br><span>before the visitor arrives.</span>","A public appointment page creates a controlled request without exposing protected VMS operations.",["PUBLIC|REQUEST|Location, time, identity and host.","PENDING|QUEUE|Request waits for review.","APPROVED|CONTROLLED|Security or admin approves.","ARRIVAL|CHECK-IN|Appointment becomes a normal visitor."]],
["18 · APPOINTMENT QUEUE","A desk-friendly approval table","Security can search, filter and operate appointments for its assigned location.",["PENDING|REVIEW|Visitor and host context.","APPROVED|READY|Accepted appointment.","INSIDE|CHECKED IN|Linked visitor is active.","NO-SHOW|CLOSE|Appointment can be marked no-show."]],
["19 · APPOINTMENT PHONE","Public booking, designed for mobile","The appointment experience is presented as a focused mobile workflow rather than a complex internal screen.",["LOCATION|SELECT|Choose the destination desk.","TIME|SCHEDULE|Select appointment date/time.","IDENTITY|VISITOR|Name, company and mobile.","HOST|MEET|Host and purpose."]],

["21 · APPOINTMENT SECURITY FLOW","Public outside.<br><span>Controlled inside.</span>","The boundary between public intake and protected processing keeps the operational system secure.",["01|PUBLIC SUBMISSION|Only PENDING request.","02|REVIEW|Location-aware approval.","03|ARRIVAL WINDOW|Scheduled-time validation.","04|CHECK-IN|Normal visitor record.","05|CHECK-OUT|Both records synchronize."]],
["22 · CHECK-IN WINDOW","Arrival processing with context","Appointments are actionable around their scheduled time and remain linked to the resulting visitor record.",["WINDOW|30 MIN BEFORE|Early arrival processing.","VALID|UNTIL +2 HOURS|Grace window after scheduled time.","LINK|VISITOR ID|Check-in creates the visitor relationship.","CLOSE|SYNC|Checkout closes both records."]],
["23 · COMPLETE SYSTEM FLOW","One workflow. Multiple modules.","The strength is not any single screen — it is the continuity between them.",["APPOINTMENT|REQUEST|Start before arrival.","SECURITY|DUTY|Establish operator context.","VISITOR|CHECK-IN|Record arrival.","ASSET / PASS|CONTROL|Manage physical movement.","TRANSFER|MOVE|Change location.","TIMELINE|TRACE|Preserve the story."]],
["24 · DATA ARCHITECTURE","The operational backbone","Firebase services support identity, records and protected visitor photography.",["AUTH|FIREBASE AUTH|Admin and location security identities.","DATA|FIRESTORE|Visitors, assets, passes, transfers and appointments.","MEDIA|STORAGE|Authenticated visitor photos.","EVENTS|MOVEMENT EVENTS|Dedicated asset history records."]],
["25 · ACCESS CONTROL","Right data.<br><span>Right operator.</span>","Role and location constraints reduce accidental cross-location access.",["ADMIN|ALL LOCATIONS|Global management and analytics.","SECURITY|OWN LOCATION|Operational access is location scoped.","DUTY|CURRENT OFFICER|Active session identifies the officer.","AUDIT|ACTOR METADATA|Actions retain who and when."]],
["26 · DOCUMENT OUTPUT","Digital workflow.<br><span>Physical-ready output.</span>","The system connects screen-based operation to printed documents used at real security desks.",["GATE PASS|A4|Barcode and movement details.","TRANSFER|A4|Source, destination and handover.","TIMELINE|REPORT|Movement history context.","PRESENTATION|PDF|A4 landscape product showcase."]],
["27 · TECHNOLOGY & DEPLOYMENT","Built for production operation","The product uses a modern web stack with connected backend services and continuous deployment.",["NEXT.JS|APPLICATION|Production web foundation.","REACT|INTERFACE|Operational dashboards and workflows.","FIREBASE|BACKEND|Auth, Firestore and Storage.","VERCEL|DEPLOYMENT|Production deployment from main."]],
["28 · ROADMAP","Today’s system.<br><span>Tomorrow’s intelligence.</span>","The foundation supports future automation without changing the operational core.",["ALERTS|NEXT|Appointment reminders and operational notifications.","INTELLIGENCE|NEXT|Exceptions, trends and deeper analytics.","MOBILE|EXPANSION|Mobile-first security workflows.","REPORTING|EXPANSION|Exportable management and audit reports."]],
["29 · DEVELOPER","Sohail Hamid Kachhi","Product design, architecture and implementation focused on turning real security-desk workflows into a connected production system.",["PRODUCT ENGINEERING|SYSTEM DESIGN|End-to-end product architecture.","FULL STACK|BUILD|Application, data, workflows and deployment.","UI / UX|OPERATIONS|Interfaces designed around actual desk usage."]],
["30 · CLOSING","Visitor Management System<br><span>for NDC Godrej at Saidhara</span>","From arrival to authorization, movement and history — one controlled operational system.",["CAPTURE|ARRIVAL|Collect the right information.","CONTROL|SECURITY|Apply role and location rules.","MOVE|OPERATE|Track physical movement.","TRACE|HISTORY|Preserve the operational trail."]]
];
function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function cards(a){return '<div class="grid '+(a.length===5?"g4":a.length===4?"g4":"g3")+'>'+a.map(x=>{let p=x.split("|");return '<article class="card"><span class="tag">'+esc(p[0])+'</span><h3>'+esc(p[1])+'</h3><p>'+esc(p.slice(2).join(" · "))+'</p></article>'}).join("")+'</div>'}
function special(n){
 if(n===0)return '<div class="heroGrid"><div><div class="ey">NDC GODREJ · SAIDHARA</div><h1>Visitor Management System<br><span>for NDC Godrej at Saidhara</span></h1><p class="lead">A connected command center for visitors, security desks, assets, gate passes, transfers, appointments and operational history.</p><div class="pills"><span>VISITOR CONTROL</span><span>SECURITY DUTY</span><span>ASSET CONTROL</span><span>APPOINTMENTS</span><span>MOVEMENT HISTORY</span></div></div>'+dashboard()+'</div>';
 if([2,3,14,15,24,25,27].includes(n))return threeD(n);
 if([5,6,17,19,20].includes(n))return deviceScene(n);
 if([9,10,11,12,13,16,21,22,23,26].includes(n))return operationalScene(n);
 if(n===28)return '<div class="scene3d"><div class="orbit"></div><div class="orbit o2"></div><div class="core3d">NEXT<br>VMS</div><div class="floatCard fc1">SMART ALERTS<br><span style="color:var(--muted)">automation layer</span></div><div class="floatCard fc2">INTELLIGENCE<br><span style="color:var(--muted)">exception signals</span></div><div class="floatCard fc3">MOBILE<br><span style="color:var(--muted)">security workflows</span></div><div class="floatCard fc4">REPORTING<br><span style="color:var(--muted)">audit intelligence</span></div></div>';
 if(n===29)return '<div class="developer"><div><div class="ey">BUILT BY</div><h2 style="font-size:clamp(34px,5vw,72px);margin:0 0 14px">Sohail Hamid<br><span style="color:var(--cyan)">Kachhi</span></h2><p class="lead">Engineering a production-grade operational system from real-world security workflows — product architecture, interface design, Firebase data, access control and deployment.</p><div class="pills"><span>PRODUCT ENGINEERING</span><span>FULL STACK</span><span>FIREBASE</span><span>UI / UX</span><span>DEPLOYMENT</span></div></div><div class="devLab"><div class="devCore">SK</div><div class="codeLine cl1">const vms = build({ security: true })</div><div class="codeLine cl2">firestore → auth → storage → events</div><div class="codeLine cl3">deploy(main) → production</div><div class="codeLine cl4">design × engineering × operations</div><div class="techOrb to1"></div><div class="techOrb to2"></div><div class="techOrb to3"></div></div></div>';
 return "";
}
function threeD(n){
 const labels=n===2?["ADMIN","I","Q","T"]:n===3?["ROSTER","DUTY","OPERATOR","AUDIT"]:n===14?["VISITORS","ASSETS","PASSES","TRANSFERS"]:n===15?["REGISTERED","PASS","TRANSFER","RETURNED"]:n===24?["AUTH","FIRESTORE","STORAGE","EVENTS"]:n===25?["ADMIN","SECURITY","DUTY","AUDIT"]:["NEXT.JS","REACT","FIREBASE","VERCEL"];
 return '<div class="scene3d"><div class="orbit"></div><div class="orbit o2"></div><div class="core3d">'+(n===2?'VMS<br>CORE':n===27?'WEB<br>STACK':'DATA<br>FLOW')+'</div>'+labels.map((x,k)=>'<div class="floatCard fc'+(k+1)+'">'+x+'<br><span style="color:var(--muted)">'+(n===27?'PRODUCTION LAYER':'CONNECTED NODE')+'</span></div>').join('')+'</div>';
}
function deviceScene(n){
 return '<div class="visual"><div class="holo"><div class="radar"></div><div class="beacon" style="left:31%;top:36%"></div><div class="beacon" style="right:28%;bottom:28%"></div><div class="floatCard fc1">CAMERA READY</div><div class="floatCard fc2">IDENTITY VERIFIED</div></div><div class="phone"><div class="notch"></div><div class="screen"><div class="ey">VMS MOBILE</div><b style="font-size:13px">'+(n===17||n===19?'Book a visit':'Identity capture')+'</b><label>LOCATION</label><div class="input"></div><label>VISITOR NAME</label><div class="input"></div><label>'+((n===6||n===20)?'PHOTO':'APPOINTMENT TIME')+'</label><div class="photo" style="height:70px"><div class="scan"></div></div></div></div></div>';
}
function operationalScene(n){
 if(n===15||n===16||n===23)return '<div class="stack3d"><div class="layer">APPOINTMENT</div><div class="layer">SECURITY DUTY</div><div class="layer">VISITOR · ASSET · PASS</div></div>';
 return '<div class="visual"><div class="window"><div class="windowHead"><b>LIVE OPERATIONS</b><span>LOCATION-AWARE</span></div><table class="table"><thead><tr><th>MODULE</th><th>STATUS</th><th>ACTOR</th></tr></thead><tbody><tr><td>Visitor / Appointment</td><td class="status">ACTIVE</td><td>Security Desk</td></tr><tr><td>Gate Pass</td><td class="status">VALID</td><td>Front Desk</td></tr><tr><td>Internal Transfer</td><td class="status">IN TRANSIT</td><td>Warehouse I → Q</td></tr><tr><td>Asset Timeline</td><td class="status">TRACEABLE</td><td>VMS Core</td></tr></tbody></table></div><div class="scene3d" style="margin:0"><div class="orbit"></div><div class="core3d" style="width:90px;height:90px;border-radius:50%;font-size:11px">CONTROL<br>POINT</div></div></div>';
}
function dashboard(){return '<div class="dash"><div class="dashTop"><i></i><i></i><i></i><span>SAIDHARA · OPERATIONS COMMAND</span><b>● LIVE SYSTEM</b></div><div class="dashBody"><div class="dashTitle"><b>Security Operations</b><span>VMS CONTROL CENTER</span></div><div class="stats"><div><strong>1,248</strong><small>VISITORS</small></div><div><strong>184</strong><small>ASSETS</small></div><div><strong>37</strong><small>GATE PASSES</small></div><div><strong>12</strong><small>TRANSFERS</small></div></div><div class="network"><span class="core">VMS<br>CORE</span><span class="node n1">ADMIN</span><span class="node n2">I</span><span class="node n3">Q</span><span class="node n4">T</span></div><div class="feed">● VISITOR CHECK-IN <b>Warehouse I</b></div><div class="feed">● TRANSFER RECEIVED <b>Warehouse Q</b></div></div></div>'}
function visual(n){if(n===6||n===19||n===20)return '<div class="visual"><div class="window"><div class="windowHead"><b>IDENTITY CAPTURE</b><span>CAMERA READY · 1080p</span></div><div class="photo"><div class="scan"></div></div><div class="flow"><span class="step">LIVE PREVIEW</span><span class="arrow">→</span><span class="step">CAPTURE</span><span class="arrow">→</span><span class="step">REVIEW</span><span class="arrow">→</span><span class="step">SAVE</span></div></div><div class="phone"><div class="notch"></div><div class="screen"><div class="ey">APPOINTMENT</div><b style="font-size:13px">Book a visit</b><label>LOCATION</label><div class="input"></div><label>VISITOR NAME</label><div class="input"></div><label>APPOINTMENT TIME</label><div class="input"></div></div></div></div>';
if(n===9||n===10||n===12||n===26)return '<div class="visual"><div class="mockpass"><div class="ey">GATE / MATERIAL CONTROL</div><h3 style="font-size:25px;margin:5px 0">GP-2026-483921</h3><p style="color:var(--muted);font-size:11px">Holder · Engineering Team &nbsp; · &nbsp; Warehouse I</p><p style="color:var(--muted);font-size:11px">Purpose · Material movement &nbsp; · &nbsp; Valid until · 18:00</p><div class="barcode"></div></div><div class="window"><div class="windowHead"><b>TRANSFER ROUTE</b><span>ITP-2026-392014</span></div><div class="timeline"><div class="event"><div class="dot">I</div><b>SENT</b><small>08:32</small></div><div class="event"><div class="dot">→</div><b>IN TRANSIT</b><small>09:10</small></div><div class="event"><div class="dot">Q</div><b>RECEIVED</b><small>11:17</small></div></div></div></div>';
if(n===16||n===23)return '<div class="flow"><span class="step">APPOINTMENT</span><span class="arrow">→</span><span class="step">SECURITY DUTY</span><span class="arrow">→</span><span class="step">VISITOR CHECK-IN</span><span class="arrow">→</span><span class="step">ASSET / PASS</span><span class="arrow">→</span><span class="step">TRANSFER</span><span class="arrow">→</span><span class="step">TIMELINE</span></div>';
return "";
}
function render(){deck.innerHTML=slides.map((s,i)=>'<section class="slide '+(i===0?"hero ":"")+(i===29?"closing":"")+'"><div class="inner">'+(i?'<div class="head"><div class="ey">'+esc(s[0])+'</div><h2>'+s[1]+'</h2><p>'+esc(s[2])+'</p></div>':'')+special(i)+cards(s[3])+(i!==0?'<div class="bar"><b>VMS WORKFLOW</b><span>'+s[3].map(x=>esc(x.split("|")[0])).join("  →  ")+'</span></div>':'')+'</div></section>').join("")}
render();const A=[...document.querySelectorAll(".slide")];let i=0;
const menu=document.getElementById("mobileMenu"),back=document.getElementById("menuBackdrop"),menuList=document.getElementById("menuList");
function buildMenu(){menuList.innerHTML=slides.map((s,k)=>'<button class="menuItem" data-slide="'+k+'"><b>'+String(k+1).padStart(2,"0")+'</b> · '+esc(s[0].replace(/^\d+\s·\s/,""))+'</button>').join("");menuList.querySelectorAll(".menuItem").forEach(b=>b.onclick=()=>{show(Number(b.dataset.slide));closeMenu()})}
function openMenu(){menu.classList.add("open");back.classList.add("open")}
function closeMenu(){menu.classList.remove("open");back.classList.remove("open")}
document.getElementById("menuBtn").onclick=openMenu;document.getElementById("menuClose").onclick=closeMenu;back.onclick=closeMenu;buildMenu();
function show(n){i=(n+A.length)%A.length;A.forEach((s,k)=>s.classList.toggle("active",k===i));count.textContent=String(i+1).padStart(2,"0")+" / "+String(A.length).padStart(2,"0");progress.style.width=((i+1)/A.length*100)+"%";menuList?.querySelectorAll(".menuItem").forEach((b,k)=>b.classList.toggle("active",k===i));location.hash="slide-"+(i+1)}
function go(d){show(i+d)}document.getElementById("next").onclick=()=>go(1);document.getElementById("prev").onclick=()=>go(-1);document.getElementById("themeBtn").onclick=()=>document.body.classList.toggle("bw");document.getElementById("printBtn").onclick=()=>window.print();document.getElementById("fullBtn").onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(1)}else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(-1)}else if(e.key==="Home")show(0);else if(e.key==="End")show(A.length-1);else if(e.key.toLowerCase()==="f")document.documentElement.requestFullscreen?.()});let sx=0;document.addEventListener("touchstart",e=>sx=e.changedTouches[0].clientX,{passive:true});document.addEventListener("touchend",e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(d<0?1:-1)},{passive:true});let h=location.hash.match(/slide-(\d+)/);show(h?Number(h[1])-1:0);
})();
</script>
