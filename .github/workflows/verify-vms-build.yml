name: Verify VMS build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyBuildVerificationKey000000000000000"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "build-verification.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "build-verification"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "build-verification.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
        run: npm run build
